<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>THOKYO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800;900&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#07050c;--blue:#9d5cff;--cyan:#7c3aed;--text:#f6f1fc;--muted:#b0a5c2;--line:rgba(184,135,255,.25);--panel:#120e1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 75% 20%,#24113f 0%,#10091b 42%,#07050c 78%)}
#shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#07050cb8,#07050ceb)}
#app{position:relative;z-index:1}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;margin:0}
.mono{font:700 11px "DM Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase}
.b{color:var(--blue)}.c{color:var(--cyan)}
.tl{height:3px;background:linear-gradient(90deg,transparent,var(--blue),#d9c2ff,transparent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#07050cd9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;justify-content:space-between;align-items:center;height:68px}
.brand{display:flex;align-items:center;gap:10px;font:900 28px "Barlow Condensed";letter-spacing:3px}
.brand i{width:30px;height:30px;border-radius:8px;overflow:hidden;background:var(--blue);display:block}.brand i img{width:100%;height:100%;object-fit:cover}
.nl{display:flex;gap:22px;align-items:center}.nl a{color:var(--text);text-decoration:none}.nl a:hover{color:var(--blue)}
.btn,.cta{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border:0;border-radius:4px;background:linear-gradient(135deg,#8b46f0,#5b21b6);color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 8px 28px #9d5cff40;font:700 11px "DM Sans";letter-spacing:.14em;text-transform:uppercase}
.btn.g{background:#07050c99;color:#e4d3ff;border:1px solid var(--blue);box-shadow:none}
.adm{background:none;border:1px solid var(--line);color:#e4d3ff;padding:8px 12px;cursor:pointer;border-radius:4px;font:700 11px "DM Sans"}
.hero{padding:72px 0 40px;text-align:center}
.logo{width:120px;height:120px;margin:0 auto 18px;border-radius:26px;border:2px solid var(--blue);box-shadow:0 10px 40px #7c3aed4d;background:linear-gradient(135deg,#2a1745,#0f0a18);display:grid;place-items:center;overflow:hidden;font:900 52px "Barlow Condensed";color:var(--blue)}
.logo img,.av img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;border:1px solid var(--blue);color:var(--blue);border-radius:99px;padding:2px 12px;margin:6px 0 10px}
.hero h1{text-shadow:0 0 42px #9d5cff55;font-weight:900;font-size:clamp(72px,17vw,170px);line-height:.85;letter-spacing:3px;margin:14px 0 18px}
.hero p{max-width:52ch;margin:0 auto 24px;color:var(--muted)}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stats{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-start;gap:clamp(14px,5vw,48px);max-width:640px;margin:36px auto 0}
.stats div{padding:0;border:0;background:none;text-align:center;min-width:0}
.stats b{display:block;font:800 clamp(24px,7vw,32px) "Barlow Condensed"}.stats span{display:block;font-size:clamp(8px,2.2vw,10px);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.on b{color:#4ade80}
section{padding:80px 0}
.sh{margin-bottom:34px}.sh h2,.ab h2{font-weight:800;font-size:clamp(40px,6vw,66px);line-height:.95;margin-top:10px}
.sh p,.ab p{color:var(--muted);max-width:56ch}
.ab{max-width:720px}
.fg{display:grid;gap:14px}@media(min-width:760px){.fg{grid-template-columns:repeat(3,1fr)}}
.f{padding:26px;background:#120e1ae6;border:1px solid var(--line);border-radius:10px}
.f .mono{color:var(--blue)}.f h3{font-weight:700;font-size:26px;margin:12px 0 6px}.f p{margin:0;color:var(--muted);font-size:14px}
.rg{display:grid;gap:12px}@media(min-width:760px){.rg{grid-template-columns:1fr 1fr}}
.r{display:flex;gap:14px;padding:18px;background:#120e1ae6;border:1px solid var(--line);border-radius:10px}.r b{font:700 24px "Barlow Condensed";color:var(--blue)}.r span{color:var(--muted);font-size:14px}
.rec{background:linear-gradient(110deg,#1d1030,#09060f);border-block:1px solid var(--line)}
.ri{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}.ri p{max-width:52ch;color:var(--muted)}
.ct{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:34px;background:linear-gradient(120deg,#1d1030,#0d0914);border:1px solid var(--line);border-radius:12px}
.lk{display:flex;gap:10px;flex-wrap:wrap}
.m .av{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;border:3px solid var(--blue);box-shadow:0 6px 22px #7c3aed4d;display:grid;place-items:center;background:linear-gradient(135deg,#2a1745,#0f0a18);font:800 28px "Barlow Condensed";color:var(--blue);overflow:hidden}
.m{text-align:center}.m b{display:block;font:700 22px "Barlow Condensed";text-transform:uppercase;color:var(--text)}
.pill{display:inline-block;border:1px solid var(--blue);color:var(--blue);border-radius:99px;padding:1px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.al{display:block;text-decoration:none}.al .av{transition:box-shadow .2s}.al:hover .av,.al:focus-visible .av{box-shadow:0 0 30px var(--blue)}.al:focus-visible{outline:2px solid var(--cyan);border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 14px}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.rows{display:grid;gap:10px;margin:0 -20px}.rows>.mono{padding-left:20px;color:#c49aff}
.mq{overflow:hidden;padding:14px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mt{display:flex;width:max-content;animation:mv linear infinite}.mt.rv{animation-direction:reverse}
.mq:hover .mt,.mq:focus-within .mt{animation-play-state:paused}
.mt .m{width:110px;flex:none;margin-right:28px}
@keyframes mv{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.mt{animation:none}.mq{overflow-x:auto}}
footer{padding:28px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;letter-spacing:.08em;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#07050cd9}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:#1d1030;border-bottom:1px solid var(--blue);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.bar button,.add,.x{background:#120e1a;color:#e4d3ff;border:1px solid var(--blue);padding:6px 12px;cursor:pointer;font:inherit;border-radius:4px}
.x{padding:0 8px;margin-top:4px}
[contenteditable]{outline:1px dashed var(--blue);outline-offset:2px;min-width:1ch;display:inline-block}
.mu{width:100%;margin-top:6px;background:#120e1a;color:var(--text);border:1px solid var(--line);padding:6px;font-size:12px;border-radius:4px}
.up{display:inline-block;margin-top:6px;font-size:12px;border:1px solid var(--blue);padding:4px 8px;cursor:pointer;color:#e4d3ff;border-radius:4px}.up input{display:none}
#msg{text-align:center;color:#e4d3ff;padding:6px}
.mus{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;width:52px;height:52px;border-radius:50%;border:2px solid var(--blue);background:#120e1a;color:var(--blue);font-size:20px;cursor:pointer;box-shadow:0 6px 22px #7c3aed66}
.mus.p{animation:pl 1.2s infinite alternate}@keyframes pl{to{box-shadow:0 0 30px var(--blue)}}
@media(prefers-reduced-motion:reduce){.mus.p{animation:none}}
@media(max-width:850px){.nl a{display:none}.nl .ne{display:none}}
.bar label{display:flex;gap:6px;align-items:center}.bar .mu{width:auto;margin:0}.mu.sm{font-size:11px}.ne{cursor:text}
.r .x,.f .x{margin-left:auto;align-self:flex-start}

.hero{position:relative;overflow:hidden;padding:96px 0 56px;text-align:left;min-height:min(86vh,760px);display:flex;align-items:center}
.hero .hi{position:relative;z-index:2;width:100%}
.hbg{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,#2a1745,#0f0a18)}
.hbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;opacity:.9}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#07050cee 0%,#07050c99 55%,#07050c40 100%),linear-gradient(180deg,transparent 60%,#07050c 100%)}
.hero h1{font-size:clamp(64px,18vw,170px);line-height:.86;margin:14px 0 18px}
.hero h1{white-space:nowrap}.hero h1 .bp{display:inline}.hero h1 .bp.b{color:var(--blue)}
.hero p{margin:0 0 24px;padding:10px 14px;border-left:2px solid var(--blue);background:#07050c66;max-width:52ch}
.hero .acts,.hero .stats{justify-content:flex-start}.hero .stats{margin:34px 0 0}
.vt{position:absolute;z-index:2;right:12px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;color:var(--blue);letter-spacing:.4em;font-size:9px}
.brand .bp.b,.brand b{color:var(--blue)}
.abg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(14px,4vw,48px);align-items:center}
.abg .ab{max-width:none}.abg .ab h2{font-size:clamp(26px,5.4vw,58px)}
.abg .ab p{font-size:clamp(12px,3.2vw,15px)}
.ai{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#2a1745,#0f0a18)}
.ai img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ai::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#07050ccc)}
.cap{position:absolute;z-index:2;left:12px;bottom:10px;font:800 clamp(20px,5vw,34px) "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.ai .up{position:absolute;z-index:3;top:8px;left:8px;background:#07050ccc}
.ast{display:flex;gap:10px;margin-top:18px}
.ast div{flex:1 1 0;min-width:0;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:#120e1ae6;text-align:center}
.ast b{display:block;font:800 clamp(22px,6vw,30px) "Barlow Condensed"}.ast span{display:block;font-size:clamp(6px,1.9vw,9px);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sh.two{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:end}
.sh.two h2,#equipe .sh h2{font-size:clamp(32px,6vw,60px)}.sh.two p{margin:0;font-size:clamp(11px,3vw,14px)}
.rh{display:flex;justify-content:space-between;gap:12px;padding:0 20px;color:var(--muted);font-size:9px}
.rows{gap:14px}
.lc{flex:none;display:block;width:clamp(124px,34vw,172px);margin-right:14px;color:inherit;text-decoration:none}
.lc .pt{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#9d5cffb0 0%,#4c1d95aa 38%,#0c0714 78%);transition:box-shadow .2s}
.lc .pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lc .ini{font:900 clamp(44px,12vw,68px) "Barlow Condensed";color:#f3eaff;text-shadow:0 0 28px var(--blue);margin-top:-30px}
.lc .lb{position:absolute;left:8px;right:8px;bottom:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#07050ccc;backdrop-filter:blur(6px);text-align:left}
.lc .rl{display:block;font-size:8px;color:var(--blue)}.lc b{display:block;font:700 clamp(17px,4.6vw,22px) "Barlow Condensed";text-transform:uppercase;line-height:1.1}
.lc small,.tc small{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tc{flex:none;display:flex;align-items:center;gap:10px;margin-right:12px;padding:8px 16px 8px 8px;border:1px solid var(--line);border-radius:10px;background:#120e1ae6;color:inherit;text-decoration:none;transition:box-shadow .2s}
.tc .av2{width:46px;height:46px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#9d5cffb0,#2a1745 70%,#0f0a18);font:800 18px "Barlow Condensed";color:#f3eaff;text-shadow:0 0 14px var(--blue)}
.tc .av2 img{width:100%;height:100%;object-fit:cover}
.tc b{display:block;font:700 19px "Barlow Condensed";text-transform:uppercase;line-height:1.1;white-space:nowrap}
.lc:hover .pt,.tc:hover,.lc:focus-visible .pt,.tc:focus-visible{box-shadow:0 0 28px #9d5cff66}

/* imagem "Quem somos" maior, como no vídeo */
.abg{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(12px,3vw,40px);align-items:center}
.ai{aspect-ratio:3/4.1;border-radius:14px}
.ai img{object-position:center 12%}
@media(min-width:760px){.abg{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}.ai{aspect-ratio:4/5}}
/* login do admin */
.lg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:#07050cf0;backdrop-filter:blur(8px)}
.lgb{width:100%;max-width:360px;padding:28px 24px;background:#120e1a;border:1px solid var(--blue);border-radius:12px;box-shadow:0 20px 60px #7c3aed55}
.lgb h3{font-weight:800;font-size:34px;letter-spacing:.04em;margin:6px 0 18px}
.lgb label{display:block;margin:0 0 12px;color:var(--muted);font:700 10px "DM Sans";letter-spacing:.16em;text-transform:uppercase}
.lgb input{display:block;width:100%;margin-top:6px;padding:12px;background:#07050c;color:var(--text);border:1px solid var(--line);border-radius:4px;font:400 15px "DM Sans";letter-spacing:normal;text-transform:none}
.lgb input:focus{outline:2px solid var(--blue);outline-offset:1px}
.lgb .er{min-height:20px;margin:0 0 10px;color:#ff7a90;font-size:12px}
.lgb .row{display:flex;gap:10px}.lgb .row button{flex:1}
.brand{gap:0}.brand i{margin-right:10px;flex:none}

/* imagem "Quem somos" grande e mesclada com o site (como no vídeo) */
.abg{grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr);gap:clamp(8px,2vw,32px)}
.ai{border:0;border-radius:0;background:none;overflow:visible;aspect-ratio:3/4.2;margin-left:-20px;margin-right:-6px}
.ai::after{display:none}
.ai img{object-fit:cover;object-position:center 8%;mix-blend-mode:lighten;transform:scale(1.08);
-webkit-mask-image:radial-gradient(ellipse 72% 68% at 50% 46%,#000 38%,rgba(0,0,0,.65) 62%,transparent 100%);
mask-image:radial-gradient(ellipse 72% 68% at 50% 46%,#000 38%,rgba(0,0,0,.65) 62%,transparent 100%)}
.ai .cap{left:26px;bottom:6%;text-shadow:0 0 18px #07050c,0 0 6px #07050c}
@media(min-width:760px){.abg{grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr)}.ai{aspect-ratio:4/5;margin:0 0 0 -40px}}

.ai img{-webkit-mask-image:radial-gradient(ellipse 52% 52% at 50% 48%,#000 50%,rgba(0,0,0,.6) 76%,transparent 100%);mask-image:radial-gradient(ellipse 52% 52% at 50% 48%,#000 50%,rgba(0,0,0,.6) 76%,transparent 100%)}
@media(min-width:760px){.abg{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}.ai{aspect-ratio:1/1.1;margin:0 0 0 -24px}}

/* botão de música flutuante */
.mus{width:56px;height:56px;padding:0;display:grid;place-items:center;border:2px solid var(--blue);border-radius:50%;background:#120e1a;color:var(--blue);box-shadow:0 4px 18px #00000099;cursor:pointer;transition:box-shadow .3s,background .3s;-webkit-tap-highlight-color:transparent}
.mus:focus-visible{outline:2px solid #e4d3ff;outline-offset:3px}
.mus .nt{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mus .eq{display:none;align-items:center;gap:3px;height:26px;filter:drop-shadow(0 0 5px var(--blue))}
.mus .eq i{display:block;width:4px;height:8px;border-radius:3px;background:currentColor;animation:eqb .9s ease-in-out infinite alternate}
.mus .eq i:nth-child(1){height:10px;animation-delay:-.2s}.mus .eq i:nth-child(2){animation-delay:-.5s;animation-duration:.7s}.mus .eq i:nth-child(3){animation-delay:-.1s;animation-duration:1.1s}.mus .eq i:nth-child(4){animation-delay:-.7s;animation-duration:.8s}.mus .eq i:nth-child(5){height:10px;animation-delay:-.35s;animation-duration:1s}
@keyframes eqb{from{height:5px}to{height:24px}}
.mus.p{background:#1a1128;box-shadow:0 0 24px var(--blue),inset 0 0 14px #9d5cff55;animation:pl 1.2s infinite alternate}
.mus.p .eq{display:flex}.mus.p .nt{display:none}
@media(prefers-reduced-motion:reduce){.mus .eq i{animation:none}.mus .eq i:nth-child(1),.mus .eq i:nth-child(5){height:12px}.mus .eq i:nth-child(2),.mus .eq i:nth-child(4){height:20px}.mus .eq i:nth-child(3){height:14px}}
</style>
</head>
